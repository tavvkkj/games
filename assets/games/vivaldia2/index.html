<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

        <title>Vivaldia 2 | yell0wsuit's website</title>

        <meta name="viewport" content="width=device-width, user-scalable=no" />

        <link rel="shortcut icon" href="TemplateData/favicon.ico" />
        <link rel="stylesheet" href="TemplateData/style.css" />

        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            canvas {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
        </style>

        <!-- Fix for loading indicator being stuck always at 90% -->
        <script type="text/javascript" src="TemplateData/xmlhttprequest-length-computable.min.js"></script>

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-SX3SJWCLEY"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-SX3SJWCLEY");
        </script>
        <script
            async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3324915803425189"
            crossorigin="anonymous"></script>
    </head>
    <body>
        <canvas id="unity-canvas" width="640" height="480"></canvas>

        <div id="unity-container">
            <div id="unity-loading-bar">
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
                <div id="unity-progress-percent"></div>
            </div>
            <div id="unity-warning"></div>
            <div id="unity-footer">
                <!-- <div id="unity-webgl-logo"></div> -->
                <div id="unity-fullscreen-button"></div>
            </div>
        </div>

        <script>
            var container = document.querySelector("#unity-container");
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var progressBarPercent = document.querySelector("#unity-progress-percent");
            var fullscreenButton = document.querySelector("#unity-fullscreen-button");
            var warningBanner = document.querySelector("#unity-warning");

            // Fullscreen does not work on iOS Safari, so hide the button.
            var userAgent = window.navigator.userAgent;
            if (userAgent.match(/iPad/i) || userAgent.match(/iPhone/i)) {
                fullscreenButton.style.display = "none";
            }

            // Shows a temporary message banner/ribbon for a few seconds, or
            // a permanent error message on top of the canvas if type=='error'.
            // If type=='warning', a yellow highlight color is used.
            // Modify or remove this function to customize the visually presented
            // way that non-critical warnings and error messages are presented to the
            // user.
            function unityShowBanner(msg, type) {
                function updateBannerVisibility() {
                    warningBanner.style.display = warningBanner.children.length ? "block" : "none";
                }
                var div = document.createElement("div");
                div.innerHTML = msg;
                warningBanner.appendChild(div);
                if (type == "error") div.style = "background: red; padding: 10px;";
                else {
                    if (type == "warning") div.style = "background: yellow; padding: 10px;";
                    setTimeout(function () {
                        warningBanner.removeChild(div);
                        updateBannerVisibility();
                    }, 5000);
                }
                updateBannerVisibility();
            }

            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/v2.loader.js";
            var config = {
                dataUrl: buildUrl + "/v2.data",
                frameworkUrl: buildUrl + "/v2.framework.js",
                codeUrl: buildUrl + "/v2.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Vivaldi Technologies",
                productName: "Vivaldia 2",
                productVersion: "1.0",
                showBanner: unityShowBanner,
                matchWebGLToCanvasSize: false,
                devicePixelRatio: 1,
            };

            loadingBar.style.display = "block";

            function fixAspect() {
                let aspect = 640 / 480;
                let newWidth = window.innerWidth;
                let newHeight = window.innerHeight;
                let window_aspect_ratio = newWidth / newHeight;

                if (aspect - window_aspect_ratio > 0) {
                    newHeight = newWidth / aspect;
                } else {
                    newWidth = newHeight * aspect;
                }
                canvas.width = document.body.clientWidth;
                canvas.height = document.body.clientHeight;
            }

            fixAspect();
            window.addEventListener("resize", fixAspect);

            var myGameInstance = null;

            document.addEventListener("keydown", function (e) {
                e.preventDefault();
            });

            // document.addEventListener("touchstart", function(e) {
            //   // e.preventDefault();
            //   for(let i = 0; i < e.touches.length; i++) {
            //     // Watch out!, GameManager means the name of the Instance of the Object in the scene.
            //     myGameInstance.SendMessage('GameManager', 'TouchStarted', e.touches[i].identifier);
            //   }
            // });
            //
            // document.addEventListener("touchmove", function(e) {
            //   // e.preventDefault();
            //   for(let i = 0; i < e.changedTouches.length; i++) {
            //     // Watch out!, GameManager means the name of the Instance of the Object in the scene.
            //     myGameInstance.SendMessage('GameManager', 'TouchMoved', e.changedTouches[i].identifier);
            //   }
            // });
            //
            // document.addEventListener("touchend", function(e) {
            //     // e.preventDefault();
            //     for(let i = 0; i < e.changedTouches.length; i++) {
            //       // Watch out!, GameManager means the name of the Instance of the Object in the scene.
            //       myGameInstance.SendMessage('GameManager', 'TouchEnded', e.changedTouches[i].identifier);
            //     }
            // });

            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    let progressPercent = (100 * progress).toFixed(2) + "%";
                    progressBarPercent.innerHTML = progressPercent;
                    progressBarFull.style.width = progressPercent;
                })
                    .then((unityInstance) => {
                        myGameInstance = unityInstance;

                        loadingBar.style.display = "none";
                        fullscreenButton.onclick = () => {
                            if (document.fullscreenElement) {
                                document.exitFullscreen();
                            } else {
                                document.body.requestFullscreen();
                            }
                        };

                        let vivaldiNamespace = typeof vivaldi !== "undefined" ? vivaldi : null;
                        if (vivaldiNamespace) {
                            // Let the game know we are running from the Vivaldi Browser
                            myGameInstance.SendMessage("Bootstrap", "VivaldiBrowserMessage");
                        }
                    })
                    .catch((message) => {
                        alert(message);
                    });
            };
            document.body.appendChild(script);
        </script>
    </body>
</html>
